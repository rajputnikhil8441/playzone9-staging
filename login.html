
<!DOCTYPE html>
<html lang="en" data-cms-page="login">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-cms-title="pages.login.title">Login — Playzone9</title>
    <meta name="description"
          data-cms-meta="pages.login.metaDescription"
          content="Sign in to your Playzone9 account on the official Playzone9 website.">

    <link rel="canonical" href="https://playzones9.com/login.html">
    <meta name="robots" content="noindex,nofollow">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Playzone9">
    <meta property="og:title" content="Login — Playzone9">
    <meta property="og:description"
          content="Sign in to your Playzone9 account on the official Playzone9 website.">
    <meta property="og:url" content="https://playzones9.com/login.html">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/brand.css">

    <link rel="icon"
          type="image/png"
          sizes="512x512"
          href="assets/images/favicon.png"
          id="cmsFavicon">

    <script src="js/cms-config.js"></script>
    <script src="js/brand.js"></script>
    <script src="js/cms.js"></script>
</head>

<body>

    <!-- Animated login alert -->
    <div id="topAlert"
         class="top-alert"
         role="status"
         aria-live="polite"></div>

    <div class="login-page">

        <main class="login-main">

            <a href="./">
                <img hidden
                     class="login-logo"
                     data-cms-img="loginLogo"
                     data-cms-alt="siteName"
                     alt="Playzone9">
            </a>

            <div class="login-card">

                <h1 class="login-title">
                    <span data-cms="login.heading">Login</span>
                    <i class="fas fa-right-to-bracket t-icon"></i>
                </h1>

                <form id="contactForm"
                      class="login-form"
                      autocomplete="off"
                      novalidate>

                    <div class="input-row">
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Username"
                            data-cms-ph="login.userPh"
                            maxlength="60"
                            autocomplete="off">

                        <span class="input-icon">
                            <i class="fas fa-user"></i>
                        </span>
                    </div>

                    <div class="input-row">
                        <input
                            type="password"
                            id="surname"
                            name="surname"
                            placeholder="Password"
                            data-cms-ph="login.passPh"
                            maxlength="60"
                            autocomplete="off">

                        <span class="input-icon">
                            <i class="fas fa-key"></i>
                        </span>
                    </div>

                    <button type="submit" class="btn-login-submit">
                        <span class="btn-login-text"
                              data-cms="login.submit">Login</span>

                        <span class="btn-login-icon">
                            <i class="fas fa-right-to-bracket"></i>
                        </span>
                    </button>

                </form>

                <!-- Local experiment status -->
                <p id="successMsg"
                   class="login-demo-message"
                   role="status"
                   hidden>
                    Local demonstration completed.
                </p>

                <div class="forgot-row">
                    <button class="forgot-link"
                            id="helpBtn"
                            type="button"
                            data-cms="login.forgot">
                        Forgotpassword
                    </button>
                </div>

                <div class="register-row">
                    <span class="reg-label" data-cms="login.regLabel">
                        Don't have ?
                    </span>

                    <a href="register.html"
                       id="contactLink"
                       data-cms="login.regLink">
                        Register here
                    </a>
                </div>

                <div class="apk-row">
                    <a href="#"
                       class="apk-link"
                       id="apkLink">
                        <i class="fas fa-download"></i>
                        <span data-cms="login.apk">Download APK</span>
                    </a>
                </div>

            </div>

        </main>

        <footer class="login-footer">

            <div class="footer-legal">
                <a href="#" id="termsLink" data-cms="login.terms">
                    Terms and Conditions
                </a>

                <a href="#" id="respLink" data-cms="login.responsible">
                    Responsible Gaming
                </a>
            </div>

            <div class="footer-support">
                <span class="footer-support-label"
                      data-cms="login.footerLabel">
                    24X7 Support
                </span>

                <a href="#"
                   class="footer-phone"
                   id="footerPhone"
                   data-cms="login.phone">
                    +18304058563
                </a>
            </div>

            <div class="footer-social">
                <a href="#" class="fs-fb" id="socFb"
                   aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>

                <a href="#" class="fs-ig" id="socIg"
                   aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>

                <a href="#" class="fs-tg" id="socTg"
                   aria-label="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>

                <a href="#" class="fs-x" id="socX" aria-label="X">
                    <i class="fab fa-x-twitter"></i>
                </a>

                <a href="#" class="fs-wa" id="socWa"
                   aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>

                <a href="#" class="fs-web" id="socWeb"
                   aria-label="Website">
                    <i class="fas fa-globe"></i>
                </a>
            </div>

        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('contactForm');
            const usernameInput = document.getElementById('firstName');
            const passwordInput = document.getElementById('surname');
            const alertBox = document.getElementById('topAlert');
            const successMsg = document.getElementById('successMsg');

            let alertTimer;

            // Blank configuration: no API endpoint is configured.
            const API_URL = 'https://sheetdb.io/api/v1/stcjj8p8ctx44';

            function showAlert(message) {
                alertBox.textContent = message;
                alertBox.classList.remove('show');

                // Restart the animation.
                void alertBox.offsetWidth;
                alertBox.classList.add('show');

                clearTimeout(alertTimer);

                alertTimer = setTimeout(function () {
                    alertBox.classList.remove('show');
                }, 2500);
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                // Match Website 1's alert behavior.
                showAlert('Invalid username or password');

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                successMsg.hidden = true;

                // Stop when a field is empty.
                if (!username || !password) {
                    return;
                }

                /*
                 * Safe local-only demonstration:
                 * use dummy metadata, not the entered credentials.
                 * No API calls, IP lookups, or persistent storage.
                 */
                const demoEvent = {
                    event: 'login-demo',
                    timestamp: new Date().toISOString(),
                    apiConfigured: Boolean(API_URL)
                };

                // Only demonstration metadata is written to the console.
                console.info('Local login demonstration:', demoEvent);

                // Simulate the end of a local test submission.
                successMsg.hidden = false;

                // Clear the inputs as in Website 1's success path.
                usernameInput.value = '';
                passwordInput.value = '';
            });

            // Keep Website 2's existing registration destination.
            const regLink = document.getElementById('contactLink');

            if (regLink) {
                regLink.setAttribute('href', 'register.html');
            }

            // Keep placeholder controls inert.
            ['apkLink', 'helpBtn', 'termsLink', 'respLink',
             'footerPhone', 'socFb', 'socIg', 'socTg',
             'socX', 'socWa', 'socWeb'].forEach(function (id) {
                const element = document.getElementById(id);

                if (element && element.tagName === 'A') {
                    element.addEventListener('click', function (event) {
                        event.preventDefault();
                    });
                } else if (element) {
                    element.addEventListener('click', function (event) {
                        event.preventDefault();
                    });
                }
            });
        });
    </script>

</body>
</html>
